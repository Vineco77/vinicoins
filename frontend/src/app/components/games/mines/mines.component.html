<div class="card-container" (click)="toggleFlip()">
  <div class="card-inner" [@flipState]="isFlipped()">
    <!-- Front Face -->
    <div class="card-front">
      <h3>Front Side</h3>
    </div>
    <!-- Back Face -->
    <div class="card-back">
      <h3>Back Side</h3>
    </div>
  </div>
</div>
